# ============================================================================
#  Project-wide configuration for the whole website.
#  This is the ONE file that ties all pages together (navbar, theme, footer).
# ============================================================================

project:
  type: website          # tells Quarto this is a multi-page website
  output-dir: _site      # rendered HTML is written here (git-ignored)
  resources:
    # the banner image is referenced only from theme.scss, so list it here to be
    # sure Quarto copies it into the built site
    - images/banners/header-banner.jpg
    - images/hero/forest-structure-2d3d.gif
    # Same rule, one step further: these are referenced only from JavaScript at
    # runtime, so Quarto's scanner never sees them. Without these three lines the
    # climate-diagram page works in `quarto preview` and 404s in production.
    - data/climate/**
    - js/**
    - images/basemap/**
    # The gallery's phone-sized photos live only in an `srcset`, which Quarto's
    # scanner doesn't follow — without this line they 404 on small screens.
    - images/lab/**
    # CNAME must be copied into every gh-pages publish, or the custom domain breaks
    - CNAME

website:
  title: "BioM2 Lab"
  description: "Biosphere Modeling & Monitoring — Xiangtao Xu Lab, Cornell EEB"
  # site-url is only needed for deployment / sitemaps; harmless to keep now.
  site-url: "https://xiangtaoxu.eeb.cornell.edu"
  # Browser-tab icon: the lab mark on its own (no wordmark, no tagline -- neither
  # survives 32 px). Quarto copies this itself, so it needs no `resources` entry.
  favicon: images/logo/biom2-mark.svg
  # Link-preview ("Open Graph") card: the thumbnail Slack, LinkedIn, X, Bluesky,
  # iMessage and mail clients show when someone pastes a link to this site. The
  # scraper is not on our domain, so the URL has to be absolute -- Quarto builds
  # that from `site-url` above, which is why this cannot move out of `website:`.
  # Regenerate with tools/make_og_card.py if the logo or the banner photo changes.
  image: /images/og/biom2-card.jpg
  image-alt: "BioM2 Lab — Biosphere Modeling and Monitoring. Xiangtao Xu Lab, Cornell EEB."
  open-graph: true
  twitter-card: true

  navbar:
    background: dark      # dark navbar -> white text/icons (legible on the dark banner)
    pinned: true          # navbar stays visible when you scroll
    left:
      - text: "Home"
        href: index.qmd
      - text: "Team"
        href: team.qmd
      - text: "Research"
        href: research.qmd
      - text: "Teaching"
        href: teaching.qmd
      - text: "CoDiFI"
        href: codifi.qmd
      - text: "News"
        href: news.qmd
      # --- Publications page is reserved for later. When you're ready,
      #     uncomment these two lines and create publications.qmd.
      # - text: "Publications"
      #   href: publications.qmd
    right:
      - icon: github
        href: https://github.com/BioM2-Lab
        aria-label: "GitHub"

  page-footer:
    center: "© 2026 BioM2 Lab · Built with [Quarto](https://quarto.org)"

format:
  html:
    # A base Bootswatch theme ("litera" = clean & friendly) layered with our
    # own tweaks in theme.scss. Order matters: theme.scss wins.
    theme: [litera, theme.scss]
    toc: false             # no table-of-contents on these landing-style pages
    smooth-scroll: true
    link-external-newwindow: true
    include-in-header:
      - text: |
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
          <!-- Private visitor counts (GoatCounter). Numbers are NOT shown on the site;
               read them at https://xiangtaoxu.goatcounter.com. Site-wide so every page is
               counted — each Teaching tool page's number is that activity card's count.
               Cookieless, and `quarto preview` on localhost is ignored automatically.
               The script must come from gc.zgo.at; the per-site subdomain only takes the
               beacon and serves the dashboard. -->
          <script data-goatcounter="https://xiangtaoxu.goatcounter.com/count"
                  async src="https://gc.zgo.at/count.js"></script>
